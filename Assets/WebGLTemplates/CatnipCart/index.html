<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{{ PRODUCT_NAME }}}</title>
  <meta name="description" content="Catnip Cart — a cat-themed kart racing game! Race as adorable cats on wild tracks.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Outfit', sans-serif;
    }

    /* ── Game canvas ── */
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0a0a12;
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #1a1430 0%, #0a0a12 70%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Floating particles ── */
    #loading-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,180,50,0.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 70%, rgba(255,120,200,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 20%, rgba(120,200,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 80%, rgba(255,220,100,0.2) 0%, transparent 100%),
        radial-gradient(2px 2px at 10% 60%, rgba(180,100,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 50%, rgba(100,255,180,0.2) 0%, transparent 100%);
      animation: sparkle 4s ease-in-out infinite alternate;
    }
    @keyframes sparkle {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* ── Logo ── */
    .logo-container {
      position: relative;
      margin-bottom: 36px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .logo-glow {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,160,40,0.25) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    .logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      position: relative;
      filter: drop-shadow(0 0 20px rgba(255,160,40,0.5));
    }

    /* ── Title ── */
    .game-title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffb840 0%, #ff6b9d 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-transform: uppercase;
      filter: drop-shadow(0 2px 12px rgba(255,107,157,0.3));
    }
    .game-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ── Progress bar ── */
    .progress-container {
      width: min(360px, 80vw);
      position: relative;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #ffb840, #ff6b9d, #c084fc);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
      transition: width 0.3s ease-out;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px rgba(255,160,40,0.8), 0 0 32px rgba(255,107,157,0.4);
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-text {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── Paw prints walking animation ── */
    .paw-prints {
      position: absolute;
      bottom: 60px;
      display: flex;
      gap: 28px;
      opacity: 0.15;
    }
    .paw {
      font-size: 18px;
      animation: paw-step 1.6s ease-in-out infinite;
    }
    .paw:nth-child(2) { animation-delay: 0.2s; }
    .paw:nth-child(3) { animation-delay: 0.4s; }
    .paw:nth-child(4) { animation-delay: 0.6s; }
    .paw:nth-child(5) { animation-delay: 0.8s; }
    @keyframes paw-step {
      0%, 100% { opacity: 0.1; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.4; transform: translateY(-6px) scale(1); }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img class="logo-img" src="logo.png" alt="Catnip Cart">
    </div>
    <div class="game-title">Catnip Cart</div>
    <div class="game-subtitle">Ready, Set, Purr!</div>
    <div class="progress-container">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">Loading...</div>
    </div>
    <div class="paw-prints">
      <span class="paw">🐾</span>
      <span class="paw">🐾</span>
      <span class="paw">🐾</span>
      <span class="paw">🐾</span>
      <span class="paw">🐾</span>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };

    var progressFill = document.getElementById("progress-fill");
    var progressText = document.getElementById("progress-text");
    var overlay = document.getElementById("loading-overlay");
    var canvas = document.querySelector("#unity-canvas");

    // Resize canvas to fill window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Update progress bar
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";

        if (pct < 30) progressText.textContent = "Herding cats...";
        else if (pct < 60) progressText.textContent = "Tuning engines...";
        else if (pct < 90) progressText.textContent = "Scattering catnip...";
        else progressText.textContent = "Almost there...";
      }).then((unityInstance) => {
        // Game loaded — fade out overlay
        progressFill.style.width = "100%";
        progressText.textContent = "Let's race!";
        setTimeout(() => {
          overlay.classList.add("hidden");
        }, 600);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
